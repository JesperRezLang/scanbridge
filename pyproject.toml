[project]
name = "scanbridge"
dynamic = ["version"]
description = "Use the Scan button on a Brother printer without Brother's software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scanbridge = "scanbridge.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "scanbridge.__version__" }

[tool.setuptools.packages.find]
include = ["scanbridge*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["poc", "recon"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
