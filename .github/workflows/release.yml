# Publishes a release: the tag vX.Y.Z, a GitHub release with generated notes, and the container image
# ghcr.io/jesperrezlang/scanbridge:X.Y.Z (plus :latest unless it is a pre-release such as 1.0.0-rc1).
#
# Run it from the Actions tab: release -> Run workflow -> enter the version (e.g. 0.2.0). The version must match
# __version__ in scanbridge/__init__.py. Pushing a tag vX.Y.Z yourself works too.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 (must match scanbridge/__init__.py)
        required: true
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        id: version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          v="${REQUESTED#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$REQUESTED' is not a version like 1.2.3"; exit 1
          fi
          if ! grep -q "__version__ = '$v'" scanbridge/__init__.py; then
            echo "::error::scanbridge/__init__.py does not say __version__ = '$v'"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "latest=false" >> "$GITHUB_OUTPUT";; *) echo "latest=true" >> "$GITHUB_OUTPUT";; esac
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            prerelease=$([ "${{ steps.version.outputs.latest }}" = true ] || echo --prerelease)
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes $prerelease
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jesperrezlang/scanbridge
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
